<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>__BOBACLAW_TITLE__</title>
<style nonce="__CSP_NONCE__">
:root {
  --bg: #f7f7f8;
  --panel: #ffffff;
  --sidebar: #efeff2;
  --text: #1b1b1f;
  --muted: #6b6b76;
  --border: #e2e2e8;
  --accent: #5b45e0;
  --accent-soft: #ece9ff;
  --accent-text: #ffffff;
  --user-bg: #ece9ff;
  --code-bg: #f2f2f5;
  --code-border: #e4e4ea;
  --ok: #1f8a4c;
  --err: #c93434;
  --warn: #9a6700;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.05);
  --radius: 12px;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151518;
    --panel: #1c1c21;
    --sidebar: #111114;
    --text: #e8e8ee;
    --muted: #9a9aa6;
    --border: #2c2c34;
    --accent: #8f7bff;
    --accent-soft: #2a2542;
    --accent-text: #0f0d1a;
    --user-bg: #2a2542;
    --code-bg: #23232a;
    --code-border: #30303a;
    --ok: #4cc38a;
    --err: #ff6b6b;
    --warn: #e3b341;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.55 var(--sans);
  -webkit-font-smoothing: antialiased;
}
button, textarea, input { font: inherit; color: inherit; }
.app { display: flex; height: 100vh; height: 100dvh; overflow: hidden; }

/* Sidebar */
.sidebar {
  width: 280px; flex: 0 0 280px; display: flex; flex-direction: column;
  background: var(--sidebar); border-right: 1px solid var(--border);
}
.sidebar-head { display: flex; align-items: center; gap: 8px; padding: 14px 12px 10px; }
.brand { font-weight: 650; font-size: 16px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.session-list { flex: 1; overflow-y: auto; padding: 4px 8px 12px; }
.session-item {
  display: block; width: 100%; text-align: left; border: 0; background: transparent;
  padding: 8px 10px; border-radius: 8px; cursor: pointer; margin-bottom: 2px;
}
.session-item:hover { background: var(--border); }
.session-item.active { background: var(--accent-soft); }
.session-title { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.session-meta { display: block; font-size: 12px; color: var(--muted); }
.sidebar-empty { color: var(--muted); font-size: 13px; padding: 8px 10px; }
.sidebar-foot { border-top: 1px solid var(--border); padding: 8px 12px; }

/* Buttons */
.btn {
  border: 1px solid var(--border); background: var(--panel); border-radius: 9px;
  padding: 7px 12px; cursor: pointer; white-space: nowrap;
}
.btn:hover { filter: brightness(0.97); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
.btn.danger { background: var(--err); border-color: var(--err); color: #fff; font-weight: 600; }
.link { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 4px 0; font-size: 13px; }
.link:hover { color: var(--text); text-decoration: underline; }
.icon-btn { border: 0; background: none; font-size: 20px; line-height: 1; padding: 6px 8px; border-radius: 8px; cursor: pointer; display: none; }
.icon-btn:hover { background: var(--border); }

/* Main */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }
.topbar {
  display: flex; align-items: center; gap: 8px; padding: 10px 18px;
  border-bottom: 1px solid var(--border); background: var(--panel); min-height: 52px;
}
.topbar h1 { font-size: 15px; font-weight: 600; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status { font-size: 12px; color: var(--muted); }
.messages { flex: 1; overflow-y: auto; padding: 20px 18px 8px; scroll-behavior: smooth; }
.thread { max-width: 820px; margin: 0 auto; }
.empty { max-width: 520px; margin: 12vh auto 0; text-align: center; color: var(--muted); }
.empty h2 { color: var(--text); font-size: 22px; margin: 0 0 6px; font-weight: 650; }

.msg { margin: 0 0 18px; display: flex; flex-direction: column; }
.msg.user { align-items: flex-end; }
.bubble {
  max-width: 85%; background: var(--user-bg); padding: 9px 14px; border-radius: 16px 16px 4px 16px;
  white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere;
}
.msg.assistant .content { max-width: 100%; overflow-wrap: anywhere; }
.msg.assistant .content.draft { color: var(--muted); }
.role { font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 600; letter-spacing: .02em; }

/* Markdown */
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p { margin: 0 0 10px; }
.md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin: 16px 0 8px; line-height: 1.3; }
.md h1 { font-size: 1.35em; } .md h2 { font-size: 1.22em; } .md h3 { font-size: 1.1em; }
.md h4, .md h5, .md h6 { font-size: 1em; }
.md ul, .md ol { margin: 0 0 10px; padding-left: 24px; }
.md li { margin: 2px 0; }
.md a { color: var(--accent); }
.md code {
  font-family: var(--mono); font-size: .88em; background: var(--code-bg);
  border: 1px solid var(--code-border); border-radius: 5px; padding: 1px 5px;
}
.md pre {
  position: relative; background: var(--code-bg); border: 1px solid var(--code-border);
  border-radius: 10px; padding: 12px 14px; overflow-x: auto; margin: 0 0 12px;
}
.md pre code { background: none; border: 0; padding: 0; font-size: 13px; line-height: 1.5; white-space: pre; }
.md blockquote { margin: 0 0 10px; padding: 2px 12px; border-left: 3px solid var(--border); color: var(--muted); }
.md hr { border: 0; border-top: 1px solid var(--border); margin: 14px 0; }
.md table { border-collapse: collapse; margin: 0 0 12px; display: block; overflow-x: auto; max-width: 100%; }
.md th, .md td { border: 1px solid var(--border); padding: 5px 10px; text-align: left; vertical-align: top; }
.md th { background: var(--code-bg); font-weight: 600; }
.copy-btn {
  position: absolute; top: 6px; right: 6px; font-size: 12px; padding: 2px 8px;
  border: 1px solid var(--code-border); background: var(--panel); border-radius: 6px; cursor: pointer; opacity: 0;
}
.md pre:hover .copy-btn, .copy-btn:focus { opacity: 1; }

/* Activity (tools, thinking) */
.activity { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.activity:empty { display: none; }
.tool {
  border: 1px solid var(--border); background: var(--panel); border-radius: 10px;
  font-size: 13px; overflow: hidden;
}
.tool > summary {
  list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px;
  padding: 6px 10px; min-width: 0;
}
.tool > summary::-webkit-details-marker { display: none; }
.tool > summary::before { content: "\25B8"; color: var(--muted); font-size: 11px; transition: transform .15s; }
.tool[open] > summary::before { transform: rotate(90deg); }
.tool-name { font-weight: 600; font-family: var(--mono); font-size: 12.5px; }
.tool-label { color: var(--muted); font-family: var(--mono); font-size: 12px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
.badge.ok { color: var(--ok); border-color: currentColor; }
.badge.err { color: var(--err); border-color: currentColor; }
.tool-body { border-top: 1px solid var(--border); padding: 8px 10px; }
.tool-body .label-full { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; margin-bottom: 6px; }
.tool-body pre {
  margin: 0; font-family: var(--mono); font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere;
  max-height: 320px; overflow-y: auto; background: var(--code-bg); border-radius: 6px; padding: 8px;
}
.note { font-size: 13px; color: var(--muted); }
.note.warn { color: var(--warn); }
.thinking { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite ease-in-out; }
.dots i:nth-child(2) { animation-delay: .2s; }
.dots i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.spinner { width: 10px; height: 10px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; flex: 0 0 auto; }
@keyframes spin { to { transform: rotate(360deg); } }
.error-box { border: 1px solid var(--err); color: var(--err); border-radius: 10px; padding: 8px 12px; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.summary-marker { margin: 0 0 18px; font-size: 13px; color: var(--muted); border: 1px dashed var(--border); border-radius: 10px; padding: 6px 12px; }
.summary-marker > summary { cursor: pointer; }
.summary-marker .md { margin-top: 8px; color: var(--text); }

/* Composer */
.composer-wrap { padding: 10px 18px 16px; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
.composer {
  max-width: 820px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px;
  background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 8px 8px 8px 14px; box-shadow: var(--shadow);
}
.composer:focus-within { border-color: var(--accent); }
.composer textarea {
  flex: 1; border: 0; outline: none; background: transparent; resize: none;
  max-height: 220px; min-height: 24px; padding: 6px 0; line-height: 1.45;
}
.hint { max-width: 820px; margin: 6px auto 0; font-size: 11.5px; color: var(--muted); text-align: center; }

/* Token modal */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
.modal-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 20px; width: 100%; max-width: 420px; box-shadow: var(--shadow); }
.modal-card h2 { margin: 0 0 8px; font-size: 18px; }
.modal-card p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
.modal-card input { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 9px; background: var(--bg); outline: none; }
.modal-card input:focus { border-color: var(--accent); }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.error { color: var(--err); font-size: 13px; margin: 10px 0 0 !important; }
.backdrop { display: none; }

@media (max-width: 760px) {
  .icon-btn { display: inline-block; }
  .sidebar { position: fixed; z-index: 40; top: 0; bottom: 0; left: 0; transform: translateX(-100%); transition: transform .2s ease; box-shadow: var(--shadow); }
  .app.nav-open .sidebar { transform: none; }
  .app.nav-open .backdrop { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 30; }
  .messages { padding: 14px 12px 6px; }
  .composer-wrap { padding: 8px 10px 12px; }
  .bubble { max-width: 92%; }
  .topbar { padding: 8px 10px; }
  .hint { display: none; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Conversations">
    <div class="sidebar-head">
      <span class="brand">__BOBACLAW_TITLE__</span>
      <button type="button" id="newChat" class="btn primary">New chat</button>
    </div>
    <nav id="sessionList" class="session-list"></nav>
    <div class="sidebar-foot"><button type="button" id="changeToken" class="link">Access token…</button></div>
  </aside>
  <div class="backdrop" id="backdrop"></div>
  <main class="main">
    <header class="topbar">
      <button type="button" id="menuBtn" class="icon-btn" aria-label="Show conversations">&#9776;</button>
      <h1 id="chatTitle">New chat</h1>
      <span id="status" class="status"></span>
    </header>
    <div id="messages" class="messages">
      <div class="thread" id="thread"></div>
    </div>
    <div class="composer-wrap">
      <form id="composer" class="composer" autocomplete="off">
        <textarea id="input" rows="1" placeholder="Message the agent…" aria-label="Message"></textarea>
        <button type="submit" id="sendBtn" class="btn primary">Send</button>
        <button type="button" id="stopBtn" class="btn danger" hidden>Stop</button>
      </form>
      <div class="hint">Enter to send &middot; Shift+Enter for a new line</div>
    </div>
  </main>
</div>

<div id="tokenModal" class="modal" hidden>
  <form id="tokenForm" class="modal-card" autocomplete="off">
    <h2>Access token</h2>
    <p>This server requires a bearer token: the value of the environment variable named by <code>channels.web.auth_token_env</code>. It is stored only in this browser.</p>
    <input type="password" id="tokenInput" placeholder="Paste token" aria-label="Access token" spellcheck="false">
    <p id="tokenError" class="error" hidden></p>
    <div class="modal-actions">
      <button type="button" id="tokenCancel" class="btn">Cancel</button>
      <button type="submit" class="btn primary">Save</button>
    </div>
  </form>
</div>

<script nonce="__CSP_NONCE__">
(function () {
  'use strict';

  var TOKEN_KEY = 'bobaclaw.web.token';
  var LAST_SESSION_KEY = 'bobaclaw.web.session';
  var APP_TITLE = document.title;

  function $(id) { return document.getElementById(id); }
  var els = {
    app: $('app'), list: $('sessionList'), thread: $('thread'), messages: $('messages'),
    input: $('input'), send: $('sendBtn'), stop: $('stopBtn'), composer: $('composer'),
    title: $('chatTitle'), status: $('status'), newChat: $('newChat'), menu: $('menuBtn'),
    backdrop: $('backdrop'), modal: $('tokenModal'), tokenForm: $('tokenForm'),
    tokenInput: $('tokenInput'), tokenError: $('tokenError'), tokenCancel: $('tokenCancel'),
    changeToken: $('changeToken')
  };

  var state = {
    sessions: [],
    current: null,       // session id or null (new chat, created lazily on first send)
    busy: false,
    streamAbort: null,   // AbortController of the running SSE fetch
    turnSession: null,   // session id the running turn belongs to
    tokenPromise: null
  };

  // ---------- storage ----------
  function store(key, value) {
    try {
      if (value === null) localStorage.removeItem(key); else localStorage.setItem(key, value);
    } catch (e) { /* storage unavailable */ }
  }
  function load(key) {
    try { return localStorage.getItem(key) || ''; } catch (e) { return ''; }
  }

  // ---------- token prompt ----------
  function promptToken(message) {
    if (state.tokenPromise) return state.tokenPromise;
    state.tokenPromise = new Promise(function (resolve, reject) {
      els.tokenError.hidden = !message;
      els.tokenError.textContent = message || '';
      els.tokenInput.value = '';
      els.modal.hidden = false;
      setTimeout(function () { els.tokenInput.focus(); }, 0);
      function cleanup() {
        els.modal.hidden = true;
        els.tokenForm.removeEventListener('submit', onSubmit);
        els.tokenCancel.removeEventListener('click', onCancel);
        state.tokenPromise = null;
      }
      function onSubmit(ev) {
        ev.preventDefault();
        var t = els.tokenInput.value.trim();
        if (!t) return;
        store(TOKEN_KEY, t);
        cleanup();
        resolve();
      }
      function onCancel() {
        cleanup();
        reject(new Error('An access token is required.'));
      }
      els.tokenForm.addEventListener('submit', onSubmit);
      els.tokenCancel.addEventListener('click', onCancel);
    });
    return state.tokenPromise;
  }

  // ---------- API ----------
  // Token goes only in the Authorization header, never in the URL.
  async function api(path, opts) {
    opts = opts || {};
    for (;;) {
      var token = load(TOKEN_KEY);
      var headers = { 'Accept': opts.accept || 'application/json' };
      if (token) headers['Authorization'] = 'Bearer ' + token;
      var init = { method: opts.method || 'GET', headers: headers, cache: 'no-store', credentials: 'same-origin' };
      if (opts.json !== undefined) {
        headers['Content-Type'] = 'application/json';
        init.body = JSON.stringify(opts.json);
      }
      if (opts.signal) init.signal = opts.signal;
      var res = await fetch(path, init);
      if (res.status === 401) {
        await promptToken(token ? 'The saved token was rejected. Enter it again.' : '');
        continue;
      }
      return res;
    }
  }

  async function apiJson(path, opts) {
    var res = await api(path, opts);
    var body = null;
    try { body = await res.json(); } catch (e) { /* not json */ }
    if (!res.ok) {
      var msg = (body && body.error) ? body.error : ('HTTP ' + res.status);
      throw new Error(msg);
    }
    return body;
  }

  // ---------- markdown (escape first, then a small safe subset) ----------
  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // `s` is already HTML-escaped. Returns HTML with inline formatting.
  function inlineMd(s) {
    var slots = [];
    function slot(html) { slots.push(html); return '\u0000' + (slots.length - 1) + '\u0000'; }
    // inline code
    s = s.replace(/`([^`\n]+)`/g, function (_, code) { return slot('<code>' + code + '</code>'); });
    // [text](http(s)://url) — only http/https targets become links
    s = s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, function (_, text, url) {
      return slot('<a href="' + url + '" target="_blank" rel="noopener noreferrer nofollow">' + emphasis(text) + '</a>');
    });
    // bare http(s) URLs (stop at escaped entities for < > " ')
    s = s.replace(/(^|[\s(])(https?:\/\/(?:(?!&lt;|&gt;|&quot;|&#39;)[^\s\u0000])+)/g, function (_, pre, url) {
      var trail = '';
      var m = url.match(/[.,;:!?)\]]+$/);
      if (m) { trail = m[0]; url = url.slice(0, -trail.length); }
      return pre + slot('<a href="' + url + '" target="_blank" rel="noopener noreferrer nofollow">' + url + '</a>') + trail;
    });
    s = emphasis(s);
    return s.replace(/\u0000(\d+)\u0000/g, function (_, i) { return slots[Number(i)]; });
  }

  function emphasis(s) {
    return s
      .replace(/\*\*(?=\S)([^*]+?)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^\w])__(?=\S)([^_]+?)__(?!\w)/g, '$1<strong>$2</strong>')
      .replace(/(^|[^*\w])\*(?=[^\s*])([^*\n]+?)\*(?!\*)/g, '$1<em>$2</em>')
      .replace(/(^|[^\w])_(?=[^\s_])([^_\n]+?)_(?!\w)/g, '$1<em>$2</em>')
      .replace(/~~(?=\S)([^~]+?)~~/g, '<del>$1</del>');
  }

  var TABLE_SEP = /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/;
  function splitRow(line) {
    var t = line.trim();
    if (t.charAt(0) === '|') t = t.slice(1);
    if (t.charAt(t.length - 1) === '|') t = t.slice(0, -1);
    return t.split('|').map(function (c) { return c.trim(); });
  }

  function renderMarkdown(src) {
    var text = escapeHtml(String(src || '').replace(/\u0000/g, '').replace(/\r\n?/g, '\n'));
    var lines = text.split('\n');
    var out = [];
    var para = [];
    var i = 0;
    function flushPara() {
      if (para.length) { out.push('<p>' + para.map(inlineMd).join('<br>') + '</p>'); para = []; }
    }
    while (i < lines.length) {
      var line = lines[i];
      var fence = line.match(/^\s*```\s*([\w+#.-]*)\s*$/);
      if (fence) {
        flushPara();
        var lang = fence[1].replace(/[^\w+#.-]/g, '');
        var code = [];
        i++;
        while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) { code.push(lines[i]); i++; }
        i++; // closing fence (or EOF)
        out.push('<pre><code' + (lang ? ' class="lang-' + lang + '"' : '') + '>' + code.join('\n') + '</code></pre>');
        continue;
      }
      if (/^\s*$/.test(line)) { flushPara(); i++; continue; }
      var h = line.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/);
      if (h) {
        flushPara();
        var level = Math.min(h[1].length + 1, 6);
        out.push('<h' + level + '>' + inlineMd(h[2]) + '</h' + level + '>');
        i++; continue;
      }
      if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { flushPara(); out.push('<hr>'); i++; continue; }
      if (/^\s*&gt;/.test(line)) {
        flushPara();
        var quote = [];
        while (i < lines.length && /^\s*&gt;/.test(lines[i])) { quote.push(lines[i].replace(/^\s*&gt;\s?/, '')); i++; }
        out.push('<blockquote>' + quote.map(inlineMd).join('<br>') + '</blockquote>');
        continue;
      }
      if (line.indexOf('|') !== -1 && i + 1 < lines.length && TABLE_SEP.test(lines[i + 1]) && lines[i + 1].indexOf('-') !== -1) {
        flushPara();
        var head = splitRow(line);
        var rows = [];
        i += 2;
        while (i < lines.length && lines[i].indexOf('|') !== -1 && !/^\s*$/.test(lines[i])) { rows.push(splitRow(lines[i])); i++; }
        var t = '<table><thead><tr>' + head.map(function (c) { return '<th>' + inlineMd(c) + '</th>'; }).join('') + '</tr></thead><tbody>';
        rows.forEach(function (r) {
          t += '<tr>' + head.map(function (_, k) { return '<td>' + inlineMd(r[k] || '') + '</td>'; }).join('') + '</tr>';
        });
        out.push(t + '</tbody></table>');
        continue;
      }
      var ul = /^\s*[-*+]\s+(.*)$/;
      var ol = /^\s*(\d{1,9})[.)]\s+(.*)$/;
      if (ul.test(line) || ol.test(line)) {
        flushPara();
        var ordered = !ul.test(line);
        var re = ordered ? ol : ul;
        var items = [];
        var start = ordered ? parseInt(line.match(ol)[1], 10) : 1;
        while (i < lines.length && re.test(lines[i])) {
          var m = lines[i].match(re);
          var item = ordered ? m[2] : m[1];
          i++;
          // continuation lines indented under the item
          while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !ul.test(lines[i]) && !ol.test(lines[i])) {
            item += '<br>' + lines[i].trim();
            i++;
          }
          items.push(item);
        }
        var tag = ordered ? 'ol' : 'ul';
        var attrs = (ordered && start !== 1) ? ' start="' + start + '"' : '';
        out.push('<' + tag + attrs + '>' + items.map(function (it) {
          return '<li>' + it.split('<br>').map(inlineMd).join('<br>') + '</li>';
        }).join('') + '</' + tag + '>');
        continue;
      }
      para.push(line);
      i++;
    }
    flushPara();
    return out.join('');
  }

  function mdElement(text, extraClass) {
    var div = document.createElement('div');
    div.className = 'md' + (extraClass ? ' ' + extraClass : '');
    div.innerHTML = renderMarkdown(text); // input is escaped inside renderMarkdown
    div.querySelectorAll('pre').forEach(function (pre) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'copy-btn';
      btn.textContent = 'Copy';
      btn.addEventListener('click', function () {
        var code = pre.querySelector('code');
        var value = code ? code.textContent : pre.textContent;
        if (navigator.clipboard) {
          navigator.clipboard.writeText(value).then(function () {
            btn.textContent = 'Copied';
            setTimeout(function () { btn.textContent = 'Copy'; }, 1200);
          }, function () { /* ignore */ });
        }
      });
      pre.appendChild(btn);
    });
    return div;
  }

  // ---------- rendering helpers ----------
  function el(tag, className, text) {
    var e = document.createElement(tag);
    if (className) e.className = className;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }

  function nearBottom() {
    var m = els.messages;
    return m.scrollHeight - m.scrollTop - m.clientHeight < 120;
  }
  function scrollToBottom(force) {
    if (force || nearBottom()) els.messages.scrollTop = els.messages.scrollHeight;
  }

  function relTime(ts) {
    var d = Date.now() / 1000 - ts;
    if (d < 60) return 'just now';
    if (d < 3600) return Math.floor(d / 60) + ' min ago';
    if (d < 86400) return Math.floor(d / 3600) + ' h ago';
    if (d < 86400 * 7) return Math.floor(d / 86400) + ' d ago';
    return new Date(ts * 1000).toLocaleDateString();
  }

  function showEmpty() {
    els.thread.textContent = '';
    var box = el('div', 'empty');
    box.appendChild(el('h2', null, 'How can I help?'));
    box.appendChild(el('div', null, 'Messages run as full agent turns: tools, sandboxed exec, memory and skills.'));
    els.thread.appendChild(box);
  }

  function clearEmpty() {
    var e = els.thread.querySelector('.empty');
    if (e) e.remove();
  }

  function addUser(text) {
    clearEmpty();
    var wrap = el('div', 'msg user');
    wrap.appendChild(el('div', 'bubble', text));
    els.thread.appendChild(wrap);
    return wrap;
  }

  function addAssistant(text) {
    clearEmpty();
    var wrap = el('div', 'msg assistant');
    wrap.appendChild(el('div', 'role', 'Agent'));
    var activity = el('div', 'activity');
    var content = el('div', 'content');
    wrap.appendChild(activity);
    wrap.appendChild(content);
    if (text) content.appendChild(mdElement(text));
    els.thread.appendChild(wrap);
    return { wrap: wrap, activity: activity, content: content };
  }

  function addSummary(text) {
    clearEmpty();
    var d = el('details', 'summary-marker');
    d.appendChild(el('summary', null, 'Earlier messages were summarized (context compaction)'));
    d.appendChild(mdElement(text));
    els.thread.appendChild(d);
  }

  // ---------- turn view (live SSE rendering) ----------
  function TurnView(view) {
    this.view = view;
    this.tools = [];
    this.thinking = null;
    this.finished = false;
  }
  TurnView.prototype.setThinking = function (label) {
    if (!this.thinking) {
      this.thinking = el('div', 'thinking');
      var dots = el('span', 'dots');
      dots.appendChild(el('i')); dots.appendChild(el('i')); dots.appendChild(el('i'));
      this.thinking.appendChild(dots);
      this.thinking.appendChild(el('span', 'thinking-label'));
    }
    this.thinking.querySelector('.thinking-label').textContent = label;
    this.view.activity.appendChild(this.thinking); // keep it last
  };
  TurnView.prototype.clearThinking = function () {
    if (this.thinking) { this.thinking.remove(); this.thinking = null; }
  };
  TurnView.prototype.startTool = function (key, name, label) {
    var d = el('details', 'tool');
    var s = el('summary');
    var spin = el('span', 'spinner');
    s.appendChild(spin);
    s.appendChild(el('span', 'tool-name', name));
    s.appendChild(el('span', 'tool-label', label || ''));
    var badge = el('span', 'badge', 'running');
    s.appendChild(badge);
    d.appendChild(s);
    var body = el('div', 'tool-body');
    if (label) body.appendChild(el('div', 'label-full', label));
    var pre = el('pre', null, '…');
    body.appendChild(pre);
    d.appendChild(body);
    this.view.activity.appendChild(d);
    if (this.thinking) this.view.activity.appendChild(this.thinking);
    this.tools.push({ key: key, open: true, spin: spin, badge: badge, pre: pre });
  };
  TurnView.prototype.endTool = function (key, exitCode, preview) {
    var t = null;
    for (var k = 0; k < this.tools.length; k++) {
      if (this.tools[k].open && this.tools[k].key === key) { t = this.tools[k]; break; }
    }
    if (!t) { this.startTool(key, key, ''); t = this.tools[this.tools.length - 1]; }
    t.open = false;
    t.spin.remove();
    var ok = exitCode === 0;
    t.badge.className = 'badge ' + (ok ? 'ok' : 'err');
    t.badge.textContent = ok ? 'ok' : ('exit ' + exitCode);
    t.pre.textContent = (preview && preview.trim()) ? preview : '(no output)';
  };
  TurnView.prototype.note = function (text, cls) {
    var n = el('div', 'note' + (cls ? ' ' + cls : ''), text);
    this.view.activity.appendChild(n);
    if (this.thinking) this.view.activity.appendChild(this.thinking);
  };
  TurnView.prototype.closeOpenTools = function () {
    this.tools.forEach(function (t) {
      if (t.open) { t.open = false; t.spin.remove(); t.badge.textContent = 'stopped'; }
    });
  };
  TurnView.prototype.setContent = function (text, draft) {
    this.view.content.textContent = '';
    if (text) this.view.content.appendChild(mdElement(text, draft ? 'draft' : ''));
  };
  TurnView.prototype.error = function (message) {
    this.view.content.textContent = '';
    this.view.content.appendChild(el('div', 'error-box', message));
  };
  TurnView.prototype.handle = function (type, data) {
    switch (type) {
      case 'start':
        this.setThinking('Working…');
        break;
      case 'thinking':
        this.setThinking('Thinking… (step ' + data.iteration + ')');
        break;
      case 'tool_start':
        this.startTool(data.name, data.name, data.label);
        this.setThinking('Running ' + data.name + '…');
        break;
      case 'tool_end':
        this.endTool(data.name, data.exit_code, data.preview);
        this.setThinking('Thinking…');
        break;
      case 'subagent_start':
        this.startTool('subagent:' + data.id, 'subagent', data.label);
        break;
      case 'subagent_end':
        this.endTool('subagent:' + data.id, data.exit_code, data.preview);
        break;
      case 'compacting':
        this.note(data.tokens ? 'Compacting context (~' + data.tokens + ' tokens)…' : 'Compacting context…');
        break;
      case 'retry':
        this.note('No reply text yet — retrying (' + data.attempt + '/' + data.max_attempts + ')', 'warn');
        break;
      case 'assistant_chunk':
        if (data.text) this.setContent(data.text, true);
        break;
      case 'interrupted':
        this.note('Interrupted', 'warn');
        break;
      case 'done':
        this.finished = true;
        this.clearThinking();
        this.closeOpenTools();
        if (data.reply) this.setContent(data.reply, false);
        else this.setContent(data.interrupted ? '_Interrupted._' : '_(no reply)_', false);
        break;
      case 'error':
        this.finished = true;
        this.clearThinking();
        this.closeOpenTools();
        this.error(data.message || 'The turn failed.');
        break;
      default:
        break;
    }
    scrollToBottom(false);
  };

  // ---------- SSE over fetch (EventSource cannot POST) ----------
  async function readSse(res, onEvent) {
    var reader = res.body.getReader();
    var decoder = new TextDecoder();
    var buf = '';
    function dispatch(frame) {
      var name = 'message';
      var data = [];
      frame.split('\n').forEach(function (raw) {
        var line = raw.replace(/\r$/, '');
        if (!line || line.charAt(0) === ':') return;
        var idx = line.indexOf(':');
        var field = idx === -1 ? line : line.slice(0, idx);
        var value = idx === -1 ? '' : line.slice(idx + 1).replace(/^ /, '');
        if (field === 'event') name = value;
        else if (field === 'data') data.push(value);
      });
      if (!data.length) return;
      var payload;
      try { payload = JSON.parse(data.join('\n')); } catch (e) { return; }
      onEvent(name, payload);
    }
    for (;;) {
      var chunk = await reader.read();
      if (chunk.done) break;
      buf += decoder.decode(chunk.value, { stream: true });
      var sep;
      while ((sep = buf.indexOf('\n\n')) !== -1) {
        dispatch(buf.slice(0, sep));
        buf = buf.slice(sep + 2);
      }
    }
    if (buf.trim()) dispatch(buf);
  }

  // ---------- sessions ----------
  function renderSessions() {
    els.list.textContent = '';
    if (!state.sessions.length) {
      els.list.appendChild(el('div', 'sidebar-empty', 'No conversations yet.'));
      return;
    }
    state.sessions.forEach(function (s) {
      var b = el('button', 'session-item' + (s.id === state.current ? ' active' : ''));
      b.type = 'button';
      b.title = s.title;
      b.appendChild(el('span', 'session-title', s.title));
      b.appendChild(el('span', 'session-meta', relTime(s.updated_at)));
      b.addEventListener('click', function () { openSession(s.id); closeNav(); });
      els.list.appendChild(b);
    });
  }

  async function refreshSessions() {
    try {
      state.sessions = await apiJson('/api/web/sessions');
    } catch (e) {
      setStatus(e.message);
      state.sessions = [];
    }
    renderSessions();
    updateTitle();
  }

  function updateTitle() {
    var s = state.sessions.find(function (x) { return x.id === state.current; });
    var t = s ? s.title : 'New chat';
    els.title.textContent = t;
    document.title = (s ? t + ' · ' : '') + APP_TITLE;
  }

  function setStatus(text) { els.status.textContent = text || ''; }

  function detachStream() {
    // Leave the server turn running (it is persisted); just stop listening.
    if (state.streamAbort) { state.streamAbort.abort(); state.streamAbort = null; }
    setBusy(false);
  }

  async function openSession(id) {
    if (state.busy && state.turnSession !== id) detachStream();
    state.current = id;
    store(LAST_SESSION_KEY, id);
    renderSessions();
    updateTitle();
    els.thread.textContent = '';
    setStatus('Loading…');
    try {
      var msgs = await apiJson('/api/web/sessions/' + encodeURIComponent(id) + '/messages');
      if (state.current !== id) return;
      els.thread.textContent = '';
      if (!msgs.length) showEmpty();
      msgs.forEach(function (m) {
        if (m.role === 'user') addUser(m.text);
        else if (m.role === 'assistant') addAssistant(m.text);
        else if (m.role === 'summary') addSummary(m.text);
      });
      setStatus('');
      scrollToBottom(true);
    } catch (e) {
      setStatus('');
      els.thread.textContent = '';
      els.thread.appendChild(el('div', 'error-box', 'Could not load conversation: ' + e.message));
    }
  }

  function newChat() {
    if (state.busy) detachStream();
    state.current = null;
    store(LAST_SESSION_KEY, null);
    renderSessions();
    updateTitle();
    showEmpty();
    els.input.focus();
  }

  // ---------- sending ----------
  function setBusy(busy) {
    state.busy = busy;
    els.send.hidden = busy;
    els.stop.hidden = !busy;
    els.stop.disabled = false;
    if (!busy) state.turnSession = null;
  }

  function autosize() {
    els.input.style.height = 'auto';
    els.input.style.height = Math.min(els.input.scrollHeight, 220) + 'px';
  }

  async function send() {
    var text = els.input.value.trim();
    if (!text || state.busy) return;
    setBusy(true);
    try {
      if (!state.current) {
        var created = await apiJson('/api/web/sessions', { method: 'POST' });
        state.current = created.id;
        store(LAST_SESSION_KEY, created.id);
        state.sessions.unshift(created);
        renderSessions();
      }
    } catch (e) {
      setBusy(false);
      setStatus('Could not create a conversation: ' + e.message);
      return;
    }
    var sid = state.current;
    state.turnSession = sid;
    els.input.value = '';
    autosize();
    addUser(text);
    var turn = new TurnView(addAssistant(''));
    turn.setThinking('Sending…');
    scrollToBottom(true);

    var ctrl = new AbortController();
    state.streamAbort = ctrl;
    try {
      var res = await api('/api/web/sessions/' + encodeURIComponent(sid) + '/messages', {
        method: 'POST', json: { text: text }, signal: ctrl.signal, accept: 'text/event-stream'
      });
      if (!res.ok) {
        var msg = 'HTTP ' + res.status;
        try { var b = await res.json(); if (b && b.error) msg = b.error; } catch (e) { /* ignore */ }
        turn.handle('error', { message: msg });
      } else {
        await readSse(res, function (type, data) { turn.handle(type, data); });
        if (!turn.finished) {
          turn.clearThinking();
          turn.closeOpenTools();
          turn.note('Connection closed before the reply finished. The turn may still be running; reopen the conversation later to see the result.', 'warn');
        }
      }
    } catch (e) {
      if (e && e.name === 'AbortError') {
        // Switched away; the server keeps running and persists the turn.
      } else {
        turn.handle('error', { message: (e && e.message) ? e.message : 'Network error' });
      }
    } finally {
      if (state.streamAbort === ctrl) {
        state.streamAbort = null;
        setBusy(false);
      }
      refreshSessions();
    }
  }

  async function stop() {
    var sid = state.turnSession || state.current;
    if (!sid) return;
    els.stop.disabled = true;
    try {
      await apiJson('/api/web/sessions/' + encodeURIComponent(sid) + '/interrupt', { method: 'POST' });
    } catch (e) {
      setStatus('Stop failed: ' + e.message);
      els.stop.disabled = false;
    }
  }

  // ---------- nav (mobile) ----------
  function closeNav() { els.app.classList.remove('nav-open'); }

  // ---------- wire up ----------
  els.composer.addEventListener('submit', function (ev) { ev.preventDefault(); send(); });
  els.input.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) {
      ev.preventDefault();
      send();
    }
  });
  els.input.addEventListener('input', autosize);
  els.stop.addEventListener('click', stop);
  els.newChat.addEventListener('click', function () { newChat(); closeNav(); });
  els.menu.addEventListener('click', function () { els.app.classList.toggle('nav-open'); });
  els.backdrop.addEventListener('click', closeNav);
  els.changeToken.addEventListener('click', function () {
    promptToken('').then(refreshSessions, function () { /* cancelled */ });
  });

  (async function init() {
    showEmpty();
    try {
      await refreshSessions();
    } catch (e) { /* surfaced via status */ }
    var last = load(LAST_SESSION_KEY);
    if (last && state.sessions.some(function (s) { return s.id === last; })) {
      openSession(last);
    } else if (state.sessions.length) {
      openSession(state.sessions[0].id);
    }
    els.input.focus();
  })();
})();
</script>
</body>
</html>
