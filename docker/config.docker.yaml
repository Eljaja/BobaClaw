# Production defaults for container deployment (copied to BOBACLAW_HOME on first start).
# Override by mounting your own config.yaml into the data volume.

provider:
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  model: gpt-4o-mini

default_agent_group: home

agent:
  max_tool_iterations: 60

executor:
  backend: docker
  network: true
  sandbox_packages: false
  docker:
    image: bobaclaw/sandbox:latest
    container_name: bobaclaw-sandbox

gateway:
  # 0.0.0.0 is required *inside* the container so the published port reaches the
  # gateway; docker-compose.prod.yml publishes it on host loopback only.
  # Non-loopback binds REQUIRE a bearer token — the gateway refuses to start without one.
  # The token comes from env BOBACLAW_GATEWAY_TOKEN (set by scripts/docker-prod-deploy.sh
  # from docker/.env, a CI secret, or data/gateway-token) or inline gateway.auth_token.
  bind: 0.0.0.0
  port: 18790
  max_parallel_turns: 4
  auth_token_env: BOBACLAW_GATEWAY_TOKEN

channels:
  telegram:
    enabled: true
    bot_token_env: TELEGRAM_BOT_TOKEN
    polling: true
    dm_policy: pairing
    allow_from: []
    group_policy: allowlist
    allowed_groups: []
    group_require_mention: true
    stream_edit_interval_ms: 800
    format: html
    proxy_url: ""
    proxy_env: TELEGRAM_PROXY

scheduler:
  enabled: true
  embedded: true
  tick_secs: 15

cron:
  jobs: []

mcp_servers:
  obscura:
    command: docker
    args:
      - run
      - --rm
      - -i
      - h4ckf0r0day/obscura
      - mcp
    enabled: true
    timeout_secs: 180
    connect_timeout_secs: 90
    tools_allowlist: []
    tools_denylist: []

routing:
  rules:
    - match:
        channel: telegram
        peer: "*"
      agent_group: home
